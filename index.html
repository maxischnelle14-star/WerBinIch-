<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wer bin ich? – Online Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-p1: #4f46e5;
            --card-p2: #ec4899;
            --accent: #10b981;
            --text-light: #f8fafc;
            --panel-bg: rgba(30, 41, 59, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 8px;
            background: linear-gradient(to right, #818cf8, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .card {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            margin-bottom: 20px;
        }

        /* Setup Screen */
        .setup-section {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 600px) {
            .setup-section {
                grid-template-columns: 1fr 1fr;
            }
        }

        .setup-box {
            background: rgba(15, 23, 42, 0.5);
            padding: 20px;
            border-radius: 12px;
            border-top: 4px solid var(--accent);
        }

        .setup-box.p1 { border-color: var(--card-p1); }
        .setup-box.p2 { border-color: var(--card-p2); }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.3);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border 0.3s;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #818cf8;
        }

        .btn {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        .btn-success:hover {
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }

        /* Game Board */
        .game-board {
            display: none;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.6);
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .timer {
            font-size: 1.2rem;
            font-weight: bold;
            font-family: monospace;
        }

        .players-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .players-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .player-card {
            background: rgba(15, 23, 42, 0.5);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .player-card.p1 { border-top: 5px solid var(--card-p1); }
        .player-card.p2 { border-top: 5px solid var(--card-p2); }

        .secret-area {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px dashed rgba(255,255,255,0.2);
        }

        .secret-word {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 1px;
            color: #f472b6;
            margin-top: 10px;
        }

        .counter-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 8px;
        }

        .counter-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .counter-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        textarea {
            width: 100%;
            height: 80px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: white;
            padding: 8px;
            resize: none;
            font-size: 0.9rem;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .winner-title {
            font-size: 2rem;
            color: #10b981;
            margin-bottom: 10px;
        }

        .hide { display: none; }
    </style>
</head>
<body>

    <header>
        <h1>Wer bin ich?</h1>
        <p>Das interaktive Spiel für zwei</p>
    </header>

    <div class="container">
        <!-- SETUP SCREEN -->
        <div id="setupScreen" class="card">
            <h2 style="margin-bottom: 20px; text-align: center;">Spiel-Vorbereitung</h2>
            <form id="setupForm" class="setup-section">
                <div class="setup-box p1">
                    <h3>Spieler 1</h3>
                    <div class="form-group" style="margin-top: 10px;">
                        <label>Dein Name:</label>
                        <input type="text" id="p1Name" value="Spieler 1" required>
                    </div>
                    <div class="form-group">
                        <label>Geheimer Begriff für Spieler 2:</label>
                        <input type="password" id="p2Secret" placeholder="z.B. Harry Potter" required>
                    </div>
                </div>

                <div class="setup-box p2">
                    <h3>Spieler 2</h3>
                    <div class="form-group" style="margin-top: 10px;">
                        <label>Dein Name:</label>
                        <input type="text" id="p2Name" value="Spieler 2" required>
                    </div>
                    <div class="form-group">
                        <label>Geheimer Begriff für Spieler 1:</label>
                        <input type="password" id="p1Secret" placeholder="z.B. Angela Merkel" required>
                    </div>
                </div>

                <div style="grid-column: 1 / -1; margin-top: 10px;">
                    <button type="submit" class="btn btn-success">Spiel Starten 🚀</button>
                </div>
            </form>
        </div>

        <!-- GAME BOARD -->
        <div id="gameBoard" class="game-board">
            <div class="top-bar">
                <div>⏱️ Zeit: <span id="timer" class="timer">00:00</span></div>
                <button class="btn" style="width: auto; padding: 6px 16px;" onclick="resetGame()">Neues Spiel 🔄</button>
            </div>

            <div class="players-grid">
                <!-- PLAYER 1 CARD -->
                <div class="player-card p1">
                    <h2 id="dispP1Name">Spieler 1</h2>
                    
                    <div class="secret-area">
                        <span style="font-size: 0.85rem; opacity: 0.7;">Dein geheimer Begriff:</span>
                        <div id="p1Word" class="secret-word hide">???</div>
                        <button class="btn" id="p1RevealBtn" style="margin-top: 10px; width: auto; font-size: 0.8rem; padding: 6px 12px;" onclick="toggleSecret(1)">Versteckt 👁️</button>
                    </div>

                    <div class="counter-box">
                        <span>Gestellte Fragen:</span>
                        <div>
                            <button class="counter-btn" onclick="adjustCount(1, -1)">-</button>
                            <span id="p1Count" style="font-weight: bold; font-size: 1.2rem; margin: 0 10px;">0</span>
                            <button class="counter-btn" onclick="adjustCount(1, 1)">+</button>
                        </div>
                    </div>

                    <div>
                        <label>Notizen / Hinweise:</label>
                        <textarea placeholder="z.B. Männlich (Ja), Schauspieler (Nein)..."></textarea>
                    </div>

                    <button class="btn btn-success" onclick="declareWinner(1)">Ich habe es erraten! 🎉</button>
                </div>

                <!-- PLAYER 2 CARD -->
                <div class="player-card p2">
                    <h2 id="dispP2Name">Spieler 2</h2>
                    
                    <div class="secret-area">
                        <span style="font-size: 0.85rem; opacity: 0.7;">Dein geheimer Begriff:</span>
                        <div id="p2Word" class="secret-word hide">???</div>
                        <button class="btn" id="p2RevealBtn" style="margin-top: 10px; width: auto; font-size: 0.8rem; padding: 6px 12px;" onclick="toggleSecret(2)">Versteckt 👁️</button>
                    </div>

                    <div class="counter-box">
                        <span>Gestellte Fragen:</span>
                        <div>
                            <button class="counter-btn" onclick="adjustCount(2, -1)">-</button>
                            <span id="p2Count" style="font-weight: bold; font-size: 1.2rem; margin: 0 10px;">0</span>
                            <button class="counter-btn" onclick="adjustCount(2, 1)">+</button>
                        </div>
                    </div>

                    <div>
                        <label>Notizen / Hinweise:</label>
                        <textarea placeholder="z.B. Real existierend (Ja), Aus Deutschland (Ja)..."></textarea>
                    </div>

                    <button class="btn btn-success" onclick="declareWinner(2)">Ich habe es erraten! 🎉</button>
                </div>
            </div>
        </div>
    </div>

    <!-- WINNER MODAL -->
    <div id="winnerModal" class="modal-overlay">
        <div class="modal">
            <div style="font-size: 3rem; margin-bottom: 10px;">🏆</div>
            <h2 class="winner-title" id="winnerText">Spieler gewinnt!</h2>
            <p id="winnerStats" style="margin-bottom: 20px; opacity: 0.9;"></p>
            <button class="btn btn-success" onclick="closeModal()">Weiter / Neues Spiel</button>
        </div>
    </div>

    <script>
        let p1Data = { name: '', secret: '', count: 0 };
        let p2Data = { name: '', secret: '', count: 0 };
        let timerInterval;
        let secondsElapsed = 0;

        document.getElementById('setupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            p1Data.name = document.getElementById('p1Name').value;
            p1Data.secret = document.getElementById('p1Secret').value;
            
            p2Data.name = document.getElementById('p2Name').value;
            p2Data.secret = document.getElementById('p2Secret').value;

            document.getElementById('dispP1Name').innerText = p1Data.name;
            document.getElementById('p1Word').innerText = p1Data.secret;

            document.getElementById('dispP2Name').innerText = p2Data.name;
            document.getElementById('p2Word').innerText = p2Data.secret;

            document.getElementById('setupScreen').style.display = 'none';
            document.getElementById('gameBoard').style.display = 'block';

            startTimer();
        });

        function toggleSecret(player) {
            const wordEl = document.getElementById(`p${player}Word`);
            const btnEl = document.getElementById(`p${player}RevealBtn`);
            
            if (wordEl.classList.contains('hide')) {
                wordEl.classList.remove('hide');
                btnEl.innerText = "Verbergen 🙈";
                btnEl.style.background = "rgba(239, 68, 68, 0.4)";
            } else {
                wordEl.classList.add('hide');
                btnEl.innerText = "Versteckt 👁️";
                btnEl.style.background = "linear-gradient(135deg, #6366f1 0%, #4f46e5 100%)";
            }
        }

        function adjustCount(player, amount) {
            if (player === 1) {
                p1Data.count = Math.max(0, p1Data.count + amount);
                document.getElementById('p1Count').innerText = p1Data.count;
            } else {
                p2Data.count = Math.max(0, p2Data.count + amount);
                document.getElementById('p2Count').innerText = p2Data.count;
            }
        }

        function startTimer() {
            secondsElapsed = 0;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                const secs = String(secondsElapsed % 60).padStart(2, '0');
                document.getElementById('timer').innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function declareWinner(player) {
            clearInterval(timerInterval);
            const winnerName = player === 1 ? p1Data.name : p2Data.name;
            const winnerCount = player === 1 ? p1Data.count : p2Data.count;
            const mins = Math.floor(secondsElapsed / 60);
            const secs = secondsElapsed % 60;
            const timeStr = mins > 0 ? `${mins} Min. und ${secs} Sek.` : `${secs} Sekunden`;

            document.getElementById('winnerText').innerText = `${winnerName} gewinnt! 🎉`;
            document.getElementById('winnerStats').innerText = `Gefundene Figur mit nur ${winnerCount} Fragen in ${timeStr}!`;

            document.getElementById('winnerModal').style.display = 'flex';

            confetti({
                particleCount: 120,
                spread: 70,
                origin: { y: 0.6 }
            });
        }

        function closeModal() {
            document.getElementById('winnerModal').style.display = 'none';
            resetGame();
        }

        function resetGame() {
            clearInterval(timerInterval);
            p1Data = { name: '', secret: '', count: 0 };
            p2Data = { name: '', secret: '', count: 0 };
            
            document.getElementById('p1Count').innerText = '0';
            document.getElementById('p2Count').innerText = '0';
            document.getElementById('setupForm').reset();
            
            // Hide secrets again
            ['1', '2'].forEach(p => {
                const wordEl = document.getElementById(`p${p}Word`);
                const btnEl = document.getElementById(`p${p}RevealBtn`);
                wordEl.classList.add('hide');
                btnEl.innerText = "Versteckt 👁️";
                btnEl.style.background = "linear-gradient(135deg, #6366f1 0%, #4f46e5 100%)";
            });

            document.getElementById('gameBoard').style.display = 'none';
            document.getElementById('setupScreen').style.display = 'block';
        }
    </script>
</body>
</html>
